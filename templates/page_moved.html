<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="2;url={{ new_url }}">
    <title>Page moved — {{ new_name }}</title>
    <style>
        body {
            font-family: system-ui, Segoe UI, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            box-sizing: border-box;
        }
        .card {
            max-width: 420px;
            background: #1e293b;
            padding: 28px 32px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.35);
            text-align: center;
        }
        h1 { font-size: 1.35rem; margin: 0 0 12px; }
        p { margin: 0 0 16px; color: #cbd5e1; line-height: 1.45; }
        .old { color: #94a3b8; font-size: 0.9rem; }
        a.btn {
            display: inline-block;
            text-decoration: none;
            color: #fff;
            background: #2563eb;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
        }
        a.btn:hover { background: #1d4ed8; }
        .hint { margin-top: 14px; font-size: 0.85rem; color: #64748b; }
    </style>
</head>
<body>
    <div class="card">
        <h1>This page has moved</h1>
        {% if old_name %}
        <p class="old">{{ old_name }} is no longer here.</p>
        {% endif %}
        <p>
            Continue to the
            <strong>{{ new_name }}</strong>.
        </p>
        <a class="btn" href="{{ new_url }}">Go to {{ new_name }}</a>
        <p class="hint">Redirecting in a moment…</p>
    </div>
</body>
</html>
