<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="2;url={{ new_url }}">
    <title>Page moved — {{ new_name }}</title>
    <style>
        :root {
            --accent: #2ad6ee;
            --accent-hover: #5ee5f7;
            --bg-panel: #0d1316;
            --bg-sunken: #06090b;
            --border-subtle: #547079;
            --text: #dfe7ea;
            --text-muted: #93a4aa;
            --text-on-accent: #03181c;
            --text-secondary: #bcc9ce;
            --radius-sm: 2px;
            --radius: 3px;
            --radius-pill: 3px;
        }

        body {
            font-family: "Cascadia Mono", Consolas, "SF Mono", "DejaVu Sans Mono", "Courier New", monospace;
            background: var(--bg-sunken);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            box-sizing: border-box;
        }
        .card {
            max-width: 420px;
            background: var(--bg-panel);
            padding: 28px 32px;
            border-radius: var(--radius);
            box-shadow: 0 10px 25px rgba(0,0,0,0.35);
            text-align: center;
        }
        h1 { font-size: 1.35rem; margin: 0 0 12px; }
        p { margin: 0 0 16px; color: var(--text-secondary); line-height: 1.45; }
        .old { color: var(--text-muted); font-size: 0.9rem; }
        a.btn {
            display: inline-block;
            text-decoration: none;
            color: var(--text-on-accent);
            background: var(--accent);
            padding: 10px 18px;
            border-radius: var(--radius);
            font-weight: 600;
        }
        a.btn:hover { background: var(--accent-hover); }
        .hint { margin-top: 14px; font-size: 0.85rem; color: var(--border-subtle); }
    </style>
</head>
<body>
    <div class="card">
        <h1>This page has moved</h1>
        {% if old_name %}
        <p class="old">{{ old_name }} is no longer here.</p>
        {% endif %}
        <p>
            Continue to the
            <strong>{{ new_name }}</strong>.
        </p>
        <a class="btn" href="{{ new_url }}">Go to {{ new_name }}</a>
        <p class="hint">Redirecting in a moment…</p>
    </div>
</body>
</html>
