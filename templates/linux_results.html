<!DOCTYPE html>
<html>
<head>
    <title>Linux Diagnostic Results</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #0f172a;
            color: #e2e8f0;
        }
        h1, h2 { margin-bottom: 8px; }
        .status { color: #94a3b8; margin-bottom: 12px; }
        .layout {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 20px;
            align-items: start;
        }
        @media (max-width: 900px) {
            .layout { grid-template-columns: 1fr; }
        }
        .console {
            background: #020617;
            color: #86efac;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            height: 60vh;
            overflow-y: auto;
            font-family: Consolas, "Courier New", monospace;
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .panel {
            background: #1e293b;
            border-radius: 8px;
            padding: 16px;
        }
        .panel h2 { font-size: 16px; margin-top: 16px; }
        .panel h2:first-child { margin-top: 0; }
        .panel pre {
            background: #020617;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 10px;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: Consolas, "Courier New", monospace;
            font-size: 13px;
            color: #cbd5e1;
        }
        a { color: #93c5fd; }
        .empty { color: #94a3b8; }
        .ok { color: #4ade80; }
        .bad { color: #f87171; }
    </style>
</head>
<body>

    <h1>Linux Diagnostic</h1>
    <p class="status" id="status">Running diagnostic... live stdout below.</p>

    <div class="layout">
        <div>
            <h2>Stdout</h2>
            <div class="console" id="console"></div>
        </div>

        <div class="panel">
            <h2>Summary</h2>
            <p><b>Unit:</b> <span id="unit" class="empty">Waiting...</span></p>
            <p><b>Hostname:</b> <span id="hostname" class="empty">Waiting...</span></p>
            <p><b>Connected:</b> <span id="connected" class="empty">Waiting...</span></p>

            <h2>Command output</h2>
            <pre id="output">Waiting...</pre>

            <h2>Error</h2>
            <pre id="error" class="empty">None</pre>
        </div>
    </div>

    <br>
    <a href="/linux">Run again</a> |
    <a href="/">Home</a>

    <script>
        const jobId = {{ job_id|tojson }};
        const consoleEl = document.getElementById("console");
        const statusEl = document.getElementById("status");
        const source = new EventSource("/linux/stream/" + jobId);

        function setText(id, value, emptyLabel) {
            const el = document.getElementById(id);
            if (value === null || value === undefined || value === "") {
                el.className = "empty";
                el.textContent = emptyLabel || "None";
                return;
            }
            el.className = "";
            el.textContent = value;
        }

        source.onmessage = function (event) {
            const data = JSON.parse(event.data);
            if (data.type === "log") {
                consoleEl.textContent += data.line + "\n";
                consoleEl.scrollTop = consoleEl.scrollHeight;
            } else if (data.type === "done") {
                const r = data.results || {};
                setText("unit", r.unit, "Unknown");
                setText("hostname", r.hostname, "Unknown");
                const connectedEl = document.getElementById("connected");
                if (r.connected) {
                    connectedEl.className = "ok";
                    connectedEl.textContent = "Yes";
                } else {
                    connectedEl.className = "bad";
                    connectedEl.textContent = "No";
                }
                setText("output", r.output, "No output");
                setText("error", r.error, "None");
                statusEl.textContent = "Diagnostic complete.";
                source.close();
            }
        };

        source.onerror = function () {
            statusEl.textContent = "Stream disconnected.";
            source.close();
        };
    </script>

</body>
</html>
