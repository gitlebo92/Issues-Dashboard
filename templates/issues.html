<!DOCTYPE html>
<html>
<head>
    <title>Unit Outage Verification Tool</title>
</head>
<body>

    <h1>Unit Outage Verification Tool</h1>
    <h2>Upload Issue.csv — the next page streams live stdout while validation runs (1-3 mins)</h2>

    <form method="POST" action="/issues/results" enctype="multipart/form-data">
        <label>Issue CSV:</label>
        <input type="file" name="issue_file" required>

        <br><br>

        <button type="submit">
            Verify Outages
        </button>
    </form>

    <br>
    <a href="/">Back</a>

</body>
</html>
